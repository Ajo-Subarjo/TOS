[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tos"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["textual"]

[project.scripts]
tos = "tos.app:main"

[tool.hatch.build.targets.wheel]
packages = ["tos"]

[tool.setuptools.package-data]
tos = ["*.tcss"]