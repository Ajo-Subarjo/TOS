
name: Build TOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --console --name TOS --add-data "tos/style.tcss;tos" tos/app.py

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --console --name TOS --add-data "tos/style.tcss:tos" tos/app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TOS-${{ runner.os }}
          path: dist/TOS*
