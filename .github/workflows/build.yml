name: build
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller --onefile --name tos --collect-data tos --collect-all textual --collect-all rich run.py
      - name: Rename for release
        shell: bash
        run: |
          cd dist
          if [ -f tos.exe ]; then mv tos.exe tos-windows.exe; else mv tos tos-linux; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
